services:
  - type: web
    name: hackcache-cycle-backend
    env: python
    rootDir: backend_final
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
